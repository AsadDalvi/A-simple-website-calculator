{% load static %}
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" type="text/css" href="{% static 'SCcss.css' %}">
</head>
<body>
    <h1 class="title">Calculator</h1>
    <div class="calculator">
        <div class="inputs">
            <form method="post">
                {% csrf_token %}
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" name="num1">
                <label for="num2">Number 2:</label>
                <input type="number" id="num2" name="num2">
                <div class="options">
                    <button type="submit" name="operation" value="add">Add</button>
                    <button type="submit" name="operation" value="sub">Subtract</button>
                    <button type="submit" name="operation" value="mul">Multiply</button>
                    <button type="submit" name="operation" value="div">Divide</button>
                </div>
            </form>
        </div>
        <div class="result">
            <p>Total:</p>
            <p>{{ result }}</p>
        </div>
    </div>
</body>
</html>
